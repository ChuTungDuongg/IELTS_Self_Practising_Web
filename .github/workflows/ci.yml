name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ielts_test
          POSTGRES_USER: ielts
          POSTGRES_PASSWORD: ielts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ielts -d ielts_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres_p2:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ielts_p2_test
          POSTGRES_USER: p2tester
          POSTGRES_PASSWORD: p2fictional
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U p2tester -d ielts_p2_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      P2_TEST_DATABASE_URL: postgresql+asyncpg://p2tester:p2fictional@localhost:5434/ielts_p2_test
      DATABASE_URL: postgresql+asyncpg://ielts:ielts@localhost:5432/ielts_test
      TEST_DATABASE_URL: postgresql+asyncpg://ielts:ielts@localhost:5432/ielts_test
      JWT_SECRET: ci-only-fictional-backend-test-jwt-secret-2026
      FRONTEND_ORIGIN: http://localhost:3000
      STORAGE_ROOT: /tmp/ielts-storage
      P5_TEST_DATABASE_URL: postgresql+asyncpg://p5tester:p5fictional@127.0.0.1:5435/ielts_p5_test
      P5_TEST_CONTAINER: bandpilot-p5-offline-test-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: backend-ci
      - name: Install locked backend dependencies
        run: uv sync --locked --group dev
      - name: Ruff lint
        run: uv run ruff check . ../scripts
      - name: Ruff format
        run: uv run ruff format --check app tests ../scripts
      - name: Upgrade fresh database
        run: uv run alembic upgrade head
      - name: Upgrade separate storage-integration test database
        env:
          DATABASE_URL: postgresql+asyncpg://p2tester:p2fictional@localhost:5434/ielts_p2_test
        run: uv run alembic upgrade head
      - name: Verify one Alembic head
        run: |
          uv run python -c 'from alembic.config import Config; from alembic.script import ScriptDirectory; heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads(); print(heads); assert len(heads) == 1, f"Expected one Alembic head, got {heads}"'
      - name: Provision isolated P5 snapshot and restore database
        run: |
          docker run --detach --rm --name "$P5_TEST_CONTAINER" --publish 127.0.0.1:5435:5432 --tmpfs /var/lib/postgresql/data:rw -e POSTGRES_USER=p5tester -e POSTGRES_PASSWORD=p5fictional -e POSTGRES_DB=ielts_p5_test postgres:17
          for attempt in $(seq 1 30); do
            if docker exec "$P5_TEST_CONTAINER" pg_isready -h 127.0.0.1 -U p5tester -d ielts_p5_test; then break; fi
            sleep 1
          done
          DATABASE_URL="$P5_TEST_DATABASE_URL" uv run alembic upgrade head
      - name: Backend tests
        run: uv run pytest -q
      - name: Stop disposable P5 PostgreSQL
        if: always()
        run: |
          if docker container inspect "$P5_TEST_CONTAINER" >/dev/null 2>&1; then
            docker stop "$P5_TEST_CONTAINER"
          fi
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Frontend unit tests
        run: npm test
